# Límites de recursos (medidos el 2026-11-17 con una canción sonando, en reposo y pidiendo un token de Spotify):
# cada uno queda por encima del pico medido, con margen. Un límite igual a la media cortaría los picos:
# por RAM Docker mata el contenedor (OOM) y por CPU el audio se entrecorta. `cpus: 1` = un núcleo entero.
# Si un contenedor se reinicia solo, revisar `docker stats` y `docker inspect -f '{{.State.OOMKilled}}' <contenedor>`.
services:
    yt-cipher:
        image: ghcr.io/kikkia/yt-cipher:master
        environment:
            - OVERRIDE_PLAYER_VARIANT=IAS
            - API_TOKEN=${YT_CIPHER_TOKEN}
        # Medido: ~156 MB, CPU casi 0
        mem_limit: 384m
        cpus: 1
        restart: always

    # Token anónimo de Spotify (con Chrome sin ventana) para que LavaSrc cargue playlists, álbumes y artistas.
    # Sin puertos publicados: solo lo usa Lavalink por la red interna.
    spotify-tokener:
        image: ghcr.io/topi314/spotify-tokener:master
        # Medido: ~128 MB en reposo; al pedir un token, 183 MB y un núcleo casi entero durante ~1 s
        mem_limit: 512m
        cpus: 1
        restart: always

    lavalink:
        image: ghcr.io/lavalink-devs/lavalink:4
        # Antes de arrancar Lavalink elige la versión del plugin de YouTube (ver lavalink-entrypoint.sh)
        entrypoint: ['sh', '/opt/Lavalink/lavalink-entrypoint.sh']
        environment:
            - YOUTUBE_PLUGIN_CHANNEL=${YOUTUBE_PLUGIN_CHANNEL:-}
            # Sin -Xmx la JVM se reservaba ~4 GB de heap; con una canción usa ~140 MB
            - JAVA_TOOL_OPTIONS=-Xmx512m
        ports:
            # Solo accesible desde esta PC (para correr el bot fuera de Docker); el bot en Docker usa la red interna
            - '127.0.0.1:2333:2333'
        volumes:
            - ./application.yml:/opt/Lavalink/application.yml:ro
            - ./lavalink-entrypoint.sh:/opt/Lavalink/lavalink-entrypoint.sh:ro
            - ./plugins:/opt/Lavalink/plugins
        depends_on:
            - yt-cipher
            - spotify-tokener
        # Listo cuando su API responde (sin contraseña contesta 401: alcanza para saber que está arriba).
        # Al arrancar baja el plugin de YouTube y carga los demás: puede tardar
        healthcheck:
            test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:2333/version"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 120s
            start_interval: 2s
        # Medido: ~410 MB (434 MB de pico), CPU media 4 % con picos de 42 % al cargar canciones.
        # 1 GB = heap de 512 MB + lo que la JVM usa fuera del heap (hilos, buffers de audio, plugins)
        mem_limit: 1g
        cpus: 1.5
        restart: always

    discord-bot:
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            # Dentro de Docker, Lavalink es el servicio "lavalink" (el .env trae localhost para correr fuera de Docker)
            - lavalinkHost=lavalink
        volumes:
            # El código y las dependencias vienen en la imagen; de la PC solo el .env (Bun lo lee solo) y los datos
            - ./.env:/usr/src/app/.env:ro
            - ./logs:/usr/src/app/logs
            - ./.moonlink:/usr/src/app/.moonlink
            # Base de datos de favoritos y playlists (bun:sqlite)
            - ./data:/usr/src/app/data
        depends_on:
            # Espera a que Lavalink responda (healthcheck), no solo a que su contenedor arranque
            lavalink:
                condition: service_healthy
        # Medido: ~67 MB (71 de pico), CPU casi 0
        mem_limit: 256m
        cpus: 0.5
        restart: always